<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股个股数据可视化</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 A股个股数据可视化</h1>
            <p class="subtitle">专业的股票数据分析工具</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="panel">
                    <h3>🎯 关注列表</h3>
                    <div class="watchlist" id="watchlist">
                        <div class="loading">加载中...</div>
                    </div>
                    <div class="add-stock">
                        <input type="text" id="newStockInput" placeholder="输入股票代码 (如: 600519.SH)">
                        <button class="btn btn-primary" onclick="addToWatchlist()">+ 添加</button>
                    </div>
                </div>

                <div class="panel">
                    <h3>🔥 热门股票</h3>
                    <div class="hot-stocks" id="hotStocks">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </aside>

            <main class="content">
                <div class="control-panel">
                    <div class="control-group">
                        <label>选择股票:</label>
                        <select id="stockSelect" onchange="loadStockData()">
                            <option value="600519.SH">600519.SH 贵州茅台</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>时间周期:</label>
                        <select id="periodSelect" onchange="loadStockData()">
                            <option value="30">30天</option>
                            <option value="90">90天</option>
                            <option value="180">180天</option>
                            <option value="365" selected>1年</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="loadStockData()">刷新数据</button>
                </div>

                <div class="stats-cards" id="statsCards">
                    <div class="card">
                        <div class="card-label">总收益率</div>
                        <div class="card-value" id="totalReturn">-</div>
                    </div>
                    <div class="card">
                        <div class="card-label">日均收益率</div>
                        <div class="card-value" id="avgReturn">-</div>
                    </div>
                    <div class="card">
                        <div class="card-label">波动率</div>
                        <div class="card-value" id="volatility">-</div>
                    </div>
                    <div class="card">
                        <div class="card-label">夏普比率</div>
                        <div class="card-value" id="sharpe">-</div>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="chart-wrapper">
                        <h3>📊 价格走势与均线</h3>
                        <div id="priceChart" class="chart"></div>
                    </div>
                </div>

                <div class="chart-row">
                    <div class="chart-wrapper half">
                        <h3>📉 RSI 指标</h3>
                        <div id="rsiChart" class="chart"></div>
                    </div>
                    <div class="chart-wrapper half">
                        <h3>📊 MACD 指标</h3>
                        <div id="macdChart" class="chart"></div>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="chart-wrapper">
                        <h3>📈 布林带</h3>
                        <div id="bollingerChart" class="chart"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
